name: Student Management CI/CD
 
on:
  push:
    branches:
      - main
 
permissions:
  contents: read
 
jobs:
  build-test-scan-publish-deploy:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
 
      - name: Build, test, and generate coverage
        run: mvn --batch-mode clean verify
 
      - name: Check SonarQube configuration
        id: sonar-config
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -z "$SONAR_HOST_URL" || -z "$SONAR_TOKEN" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping SonarQube analysis because SONAR_HOST_URL or SONAR_TOKEN is not configured."
          elif [[ ! "$SONAR_HOST_URL" =~ ^https?://[^/]+(/.*)?$ ]]; then
            echo "::error::SONAR_HOST_URL must be a full URL starting with http:// or https://, not an API path."
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
 
      - name: Run SonarQube analysis and wait for quality gate
        if: steps.sonar-config.outputs.enabled == 'true'
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn --batch-mode
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar
          -Dsonar.host.url="${SONAR_HOST_URL%/}"
          -Dsonar.qualitygate.wait=true
 
      - name: Check Docker Hub configuration
        id: docker-config
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Docker image publishing because Docker Hub credentials are not configured."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
 
      - name: Set up Docker Buildx
        if: steps.docker-config.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3
 
      - name: Log in to Docker Hub
        if: steps.docker-config.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      - name: Build and push Docker image
        if: steps.docker-config.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/student-management:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/student-management:${{ github.sha }}
 
      - name: Check deployment configuration
        id: deploy-config
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [[ -z "$SERVER_HOST" || -z "$SERVER_USER" || -z "$SERVER_SSH_KEY" ||
                -z "$DB_HOST" || -z "$DB_NAME" || -z "$DB_USERNAME" || -z "$DB_PASSWORD" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment because SSH or database credentials are not fully configured."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
 
      - name: Deploy to Ubuntu server
        if: steps.docker-config.outputs.enabled == 'true' && steps.deploy-config.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/student-management:${{ github.sha }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          envs: IMAGE,DB_HOST,DB_NAME,DB_USERNAME,DB_PASSWORD
          script: |
            set -e
            docker pull "$IMAGE"
            docker stop student-management || true
            docker rm student-management || true
            docker run --detach \
              --name student-management \
              --restart unless-stopped \
              --publish 8080:8080 \
              --env SERVER_PORT=8080 \
              --env SPRING_DATASOURCE_URL="jdbc:mysql://${DB_HOST}:3306/${DB_NAME}" \
              --env SPRING_DATASOURCE_USERNAME="$DB_USERNAME" \
              --env SPRING_DATASOURCE_PASSWORD="$DB_PASSWORD" \
              "$IMAGE"
            docker image prune --force
 